    styleEl.textContent = &quot;/* OptionWheel — nav overlay (home page only) */\n\nbody.home .idx-nav { display: none !important; }\n\n.ow-toggle {\n  position: fixed;\n  top: 22px;\n  left: 20px;\n  z-index: 100000;\n  background: none;\n  border: none;\n  margin: 0;\n  padding: 8px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  font-family: inherit;\n  -webkit-tap-highlight-color: transparent;\n}\n.ow-toggle__bars { width: 20px; height: 12px; position: relative; }\n.ow-toggle__bars span {\n  position: absolute; left: 0; right: 0; height: 1px; background: #fff;\n  transition: transform .25s ease, opacity .2s ease, top .25s ease;\n}\n.ow-toggle__bars span:nth-child(1){ top: 0; }\n.ow-toggle__bars span:nth-child(2){ top: 6px; }\n.ow-toggle__bars span:nth-child(3){ top: 12px; }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(1){ top: 6px; transform: rotate(45deg); }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(2){ opacity: 0; }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(3){ top: 6px; transform: rotate(-45deg); }\n\n.ow-backdrop {\n  position: fixed;\n  inset: 0;\n  z-index: 99998;\n  background: rgba(0,0,0,0.6);\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .35s ease;\n}\n.ow-backdrop.is-open {\n  opacity: 1;\n  pointer-events: auto;\n}\n\n.ow-root {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  outline: none;\n  touch-action: none;\n  user-select: none;\n  cursor: grab;\n}\n.ow-root.ow-dragging { cursor: grabbing; }\n\n.ow-item {\n  position: absolute;\n  top: 50%;\n  left: var(--ow-inset, 64px);\n  white-space: nowrap;\n  text-decoration: none;\n  font-family: inherit;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 300;\n  font-size: var(--ow-font-size, 1.4rem);\n  line-height: 1;\n  transform-origin: left center;\n  cursor: pointer;\n  will-change: transform, opacity, filter;\n  color: color-mix(in srg       return state.files.reduce(function (s, f) { return s + f.size; }, 0);
    }

    function validateStep(idx) {
      var step = STEPS[idx];
      var val = state.answers[step.key];
      if (!val || !String(val).trim()) return false;
      if (step.type === 'email') {
        var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(val).trim());
      }
      return true;

      i.type = 'hidden';
      i.name = name;
      i.value = value;
      form.appendChild(i);

      if (state.sending) return;
      state.sending = true;
      if (btn) {
        btn.disabled = true;
        var lab = btn.querySelector('.msf-btn-label');
        if (lab) lab.textContent = 'ENVIANDO...';
      }

      var a = state.answers;
      var sinkName = 'msf-sink-' + Date.now();
      var sink = document.createElement('iframe');
      sink.name = sinkName;
      sink.style.display = 'none';

      form.enctype = 'multipart/form-data';

      addHidden(form, '_template', 'table');
      addHidden(form, 'Nome', a.name || '');
      addHidden(form, 'email', a.email || '');
      addHidden(form, 'Assunto', a.subject || '');
      addHidden(form, 'Mensagem', a.message || '');

            var fi = document.createElement('input');
            fi.type = 'file';

          li.appendChild(name);
          li.appendChild(size);
          li.appendChild(rm);
          list.appendChild(li);

        if (step.attachments) fieldWrap.appendChild(buildAttachments(errorEl));

        fieldWrap.appendChild(errorEl);
        card.appendChild(fieldWrap);

        inputEl.addEventListener('input', function () {
          state.answers[step.key] = inputEl.value;

        });

            if (e.key === 'Enter') { e.preventDefault(); goNext(); }

        }

        nav.className = 'msf-nav';

          back.type = 'button';
          back.className = 'msf-back';
          back.textContent = '← VOLTAR';
          back.addEventListener('click', function () { goTo(idx - 1); });
          nav.appendChild(back);

        var fwd = buildPillButton(isLast ? 'ENVIAR PROJETO →' : 'AVANÇAR →', function () { goNext(); });
        nav.appendChild(fwd);
        card.appendChild(nav);

        function goNext() {
          if (!validateStep(idx)) {
            errorEl.textContent = step.type === 'email' ? 'Digite um e-mail válido.' : 'Esse campo é necessário pra continuar.';
            return;
          }

        }

        requestAnimationFrame(function () { card.style.opacity = '1'; });
        if (idx > 0) { try { inputEl.focus({ preventScroll: true }); } catch (e) {} }
      }, 180);
    }

    render();
    return root;
  }

    l2.textContent = video.title;
    nameInner.appendChild(l1);
    nameInner.appendChild(l2);
    nameWrap.appendChild(nameInner);

    var arrow = document.createElement('span');
    arrow.className = 'wk-video-arrow';
    arrow.textContent = '↗';

    row.appendChild(num);
    row.appendChild(nameWrap);
    row.appendChild(arrow);

    row.addEventListener('click', function () { onOpen(video); });

    return row;
  }

  function buildSoonPanel(cat) {
    var panel = document.createElement('div');
    panel.className = 'wk-panel wk-soon-panel';
    panel.setAttribute('data-panel', cat.key);

    var tag = document.createElement('span');
    tag.className = 'wk-soon-tag';
    tag.textContent = 'EM BREVE';

    var label = document.createElement('h3');
    label.className = 'wk-soon-label';
    label.textContent = cat.label;

    var desc = document.createElement('p');
    desc.className = 'wk-soon-desc';
    desc.textContent = 'Esta categoria está em curadoria. Em breve, cada trabalho vai ganhar seu próprio case aqui — com imagem, contexto e crédito completo.';

    panel.appendChild(tag);
    panel.appendChild(label);
    panel.appendChild(desc);
    return panel;
  }

  function buildDetailOverlay() {
    var overlay = document.createElement('div');
    overlay.className = 'wk-detail';
    overlay.id = 'wk-detail';

    var inner = document.createElement('div');
    inner.className = 'wk-detail-inner';

    var back = document.createElement('button');
    back.className = 'wk-back';
    back.type = 'button';
    back.textContent = '← VOLTAR';
    back.addEventListener('click', closeDetail);

    var title = document.createElement('h2');
    title.className = 'wk-detail-title';
    title.id = 'wk-detail-title';

    var playerWrap = document.createElement('div');
    playerWrap.className = 'wk-detail-player';
    playerWrap.id = 'wk-detail-player';

    var ficha = document.createElement('section');
    ficha.className = 'wk-ficha';
    ficha.id = 'wk-detail-ficha';
    ficha.hidden = true;
    var fichaLabel = document.createElement('span');
    fichaLabel.className = 'wk-ficha-label';
    fichaLabel.textContent = 'Ficha técnica';
    var fichaList = document.createElement('dl');
    fichaList.className = 'wk-ficha-list';
    fichaList.id = 'wk-detail-ficha-list';
    ficha.appendChild(fichaLabel);
    ficha.appendChild(fichaList);

    inner.appendChild(back);
    inner.appendChild(title);
    inner.appendChild(playerWrap);
    inner.appendChild(ficha);
    overlay.appendChild(inner);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeDetail();
    });

    document.body.appendChild(overlay);
    return overlay;
  }

  function fillFicha(video) {
    var ficha = document.getElementById('wk-detail-ficha');
    var list = document.getElementById('wk-detail-ficha-list');
    if (!ficha || !list) return;
    list.innerHTML = '';
    var rows = (video.ficha || []).filter(function (r) {
      return r &amp;&amp; (Array.isArray(r) ? r.join('').trim() : String(r).trim());
    });
    rows.forEach(function (r) {
      if (!Array.isArray(r)) r = [String(r)];
      if (r.length >= 2 &amp;&amp; String(r[0]).trim()) {
        var dt = document.createElement('dt');
        dt.textContent = r[0];
        var dd = document.createElement('dd');
        dd.textContent = r.slice(1).join(', ');
        list.appendChild(dt);
        list.appendChild(dd);
      } else {
        var full = document.createElement('dd');
        full.className = 'wk-ficha-full';
        full.textContent = r.filter(Boolean).join(' ');
        list.appendChild(full);
      }
    });
    ficha.hidden = rows.length === 0;
  }

  function closeDetail() {
    var overlay = document.getElementById('wk-detail');
    if (!overlay) return;
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
    setTimeout(function () {
      var playerWrap = document.getElementById('wk-detail-player');
      if (playerWrap) playerWrap.innerHTML = '';
    }, 350);
  }

  function openDetail(video) {
    var overlay = document.getElementById('wk-detail') || buildDetailOverlay();
    var title = document.getElementById('wk-detail-title');
    var playerWrap = document.getElementById('wk-detail-player');
    title.textContent = video.title;

    var ratio = (video.height / video.width) * 100;
    playerWrap.style.paddingTop = ratio + '%';
    playerWrap.innerHTML = '';
    var iframe = document.createElement('iframe');
    iframe.src = 'https://player.vimeo.com/video/' + video.id + '?app_id=122963';
    iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
    iframe.setAttribute('allowfullscreen', '');
    playerWrap.appendChild(iframe);

    fillFicha(video);
    overlay.scrollTop = 0;

    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { overlay.classList.add('is-open'); });
  }

  function buildSection(anchor) {
    injectStyles();

    var tabs = document.createElement('div');
    tabs.className = 'wk-tabs';
    tabs.id = 'wk-tabs';

    var nav = document.createElement('div');
    nav.className = 'wk-tabs-nav';
    var caption = document.createElement('div');
    caption.className = 'wk-tabs-nav-caption';
    caption.textContent = 'CATEGORIAS';
    nav.appendChild(caption);

    var panelWrap = document.createElement('div');
    panelWrap.className = 'wk-tabs-panel';

    var videoListPanel = document.createElement('div');
    videoListPanel.className = 'wk-panel wk-video-list is-active';
    videoListPanel.setAttribute('data-panel', 'video');
    VIDEOS.forEach(function (video, i) {
      videoListPanel.appendChild(buildVideoRow(video, i, openDetail));
    });
    panelWrap.appendChild(videoListPanel);

    var panelsByKey = { video: videoListPanel };
    CATS.filter(function (c) { return !c.ready; }).forEach(function (cat) {
      var p = buildSoonPanel(cat);
      panelWrap.appendChild(p);
      panelsByKey[cat.key] = p;
    });

    function selectCat(key) {
      Array.prototype.forEach.call(nav.querySelectorAll('.wk-roll-item'), function (el) {
        el.classList.toggle('active', el.getAttribute('data-cat') === key);
      });
      Object.keys(panelsByKey).forEach(function (k) {
        panelsByKey[k].classList.toggle('is-active', k === key);
      });
    }

    CATS.forEach(function (cat, i) {
      var item = buildNavItem(cat, i === 0, function () { selectCat(cat.key); });
      nav.appendChild(item);
    });

    tabs.appendChild(nav);
    tabs.appendChild(panelWrap);

    anchor.insertAdjacentElement('afterend', tabs);
    anchor.style.display = 'none';

    mounted = true;
  }

  function tryMount(attemptsLeft) {
    if (mounted) return;
    var anchor = document.querySelector('.wk-index');
    if (!anchor) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildSection(anchor);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(40); });
  } else {
    tryMount(40);
  }
})();
