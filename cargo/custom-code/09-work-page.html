   abaixo do player na tela de detalhe.

   formato ['Função', 'Nome']. Exemplo:

     ficha: [
       ['Direção', 'Pedro'],
       ['Cliente', 'Marca X'],
       ['Direção de Fotografia', 'Fulano'],
       ['Montagem', 'Ciclano']
     ]

   Uma linha só com texto (sem função) também funciona: ['Texto livre'].
   Enquanto a ficha estiver vazia ( ficha: [] ), a seção não aparece.

   Mounts inside the Work page's own bodycopy, right after the
   existing ".wk-index" block (which is hidden, kept in the DOM as
   a fallback). Runs bridged inside an iframe via srcdoc (see the
   other *-bridged.js loaders on this site for why).
   _____________________________________________________________ */
(function () {

  var parentWindow = isBridged ? window.parent : window;
  var document = parentWindow.document;

  var VIDEOS = [

      ficha: [

  function injectStyles() {
    // The React build owns these rules in src/app/globals.css so they can share

    return;
    if (document.getElementById('work-page-styles')) return;
    var styleEl = document.createElement('style');
    styleEl.id = 'work-page-styles';
    styleEl.textContent = "/* Work page — category tabs (Vídeo / Fotografia / Direção Criativa / Produção) */\n.wk-tabs {\n  display: flex;\n  align-items: flex-start;\n  gap: 5%;\n  padding: 50px 60px 10px;\n  border-top: 1px solid rgba(255,255,255,.12);\n  min-height: 420px;\n  box-sizing: border-box;\n}\n.wk-tabs-nav {\n  flex: 0 0 260px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  position: sticky;\n  top: 120px;\n}\n.wk-roll-item {\n  display: block;\n  overflow: hidden;\n  perspective: 300px;\n  padding: 10px 0;\n  cursor: pointer;\n  font-size: clamp(20px, 2.1vw, 28px);\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: -0.01em;\n  color: rgba(255,255,255,0.4);\n  transition: color 0.3s ease;\n  border: 0;\n  background: none;\n  text-align: left;\n  width: 100%;\n}\n.wk-roll-item.active,\n.wk-roll-item:hover { color: #fff; }\n.wk-roll-item .wk-roll-char {\n  display: inline-block;\n  transform-style: preserve-3d;\n  transition: transform 0.5s cubic-bezier(.2,.9,.3,1);\n  position: relative;\n}\n.wk-roll-item .wk-roll-char .wk-rc-face {\n  display: block;\n  backface-visibility: hidden;\n}\n.wk-roll-item .wk-roll-char .wk-rc-back {\n  position: absolute;\n  top: 0; left: 0;\n  transform: rotateX(90deg) translateY(0.08em);\n}\n.wk-roll-item:hover .wk-roll-char { transform: rotateX(-90deg); }\n.wk-tabs-nav-caption {\n  font-size: 0.72rem;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.4);\n  margin-bottom: 18px;\n}\n\n.wk-tabs-panel { flex: 1 1 0; min-width: 0; }\n.wk-panel {\n  display: none;\n}\n.wk-panel.is-active { display: block; }\n\n.wk-video-list { flex-direction: column; }\n.wk-video-list.is-active { display: flex; }\n.wk-video-row {\n  display: flex;\n  align-items: baseline;\n  gap: 24px;\n  padding: 22px 0;\n  border-bottom: 1px solid rgba(255,255,255,0.1);\n  cursor: pointer;\n}\n.wk-video-row:first-child { border-top: 1px solid rgba(255,255,255,0.1); }\n.wk-video-num {\n  font-size: 13px;\n  color: rgba(255,255,255,0.45);\n  width: 26px;\n  flex: 0 0 auto;\n}\n.wk-video-name-wrap {\n  overflow: hidden;\n  flex: 1 1 auto;\n  min-width: 0;\n  font-size: clamp(18px, 2.6vw, 30px);\n  line-height: 1.25;\n  height: 1.25em;\n}\n.wk-video-name-inner {\n  display: flex;\n  flex-direction: column;\n  transition: transform 0.45s cubic-bezier(.65,0,.35,1);\n}\n.wk-video-row:hover .wk-video-name-inner { transform: translateY(-50%); }\n.wk-line {\n  font-size: clamp(18px, 2.6vw, 30px);\n  font-weight: 500;\n  text-transform: uppercase;\n  color: #fff;\n  line-height: 1.25;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.wk-video-arrow {\n  font-size: 20px;\n  color: rgba(255,255,255,0.5);\n  transition: transform 0.3s ease, color 0.3s ease;\n  flex: 0 0 auto;\n}\n.wk-video-row:hover .wk-video-arrow { transform: translate(4px,-4px); color: #fff; }\n\n.wk-soon-panel {\n  padding: 30px 0 60px;\n}\n.wk-soon-label {\n  font-size: clamp(32px, 4.5vw, 56px);\n  font-weight: 600;\n  text-transform: uppercase;\n  color: #fff;\n  margin: 0 0 18px;\n  line-height: 1;\n}\n.wk-soon-tag {\n  display: inline-block;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n  border: 1px solid rgba(255,255,255,0.25);\n  border-radius: 999px;\n  padding: 6px 16px;\n  margin-bottom: 22px;\n}\n.wk-soon-desc {\n  font-size: 1rem;\n  line-height: 1.6;\n  color: rgba(255,255,255,0.7);\n  max-width: 460px;\n}\n\n@media (max-width: 860px) {\n  .wk-tabs { flex-direction: column; padding: 36px 6% 10px; gap: 28px; }\n  .wk-tabs-nav {\n    position: static;\n    flex-direction: row;\n    flex-wrap: wrap;\n    gap: 4px 22px;\n  }\n  .wk-roll-item { font-size: 16px; padding: 6px 0; }\n  .wk-line { font-size: 20px; }\n}\n\n/* ---- Video detail (in-site player, iconoclast.tv-style minimal view) ---- */\n.wk-detail {\n  position: fixed;\n  inset: 0;\n  z-index: 9999;\n  background: #0b0b0b;\n  color: #fff;\n  overflow-y: auto;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.35s ease;\n}\n.wk-detail.is-open { opacity: 1; pointer-events: auto; }\n.wk-detail-inner {\n  max-width: 1100px;\n  margin: 0 auto;\n  padding: 110px 6% 100px;\n  box-sizing: border-box;\n}\n.wk-back {\n  background: none;\n  border: 0;\n  color: rgba(255,255,255,0.7);\n  font-size: 12px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  cursor: pointer;\n  padding: 0;\n  margin-bottom: 48px;\n  transition: color 0.2s ease;\n}\n.wk-back:hover { color: #fff; }\n.wk-detail-title {\n  font-size: clamp(28px, 4.2vw, 54px);\n  font-weight: 600;\n  text-transform: uppercase;\n  line-height: 1.05;\n  margin: 0 0 44px;\n  max-width: 900px;\n}\n.wk-detail-player {\n  position: relative;\n  width: 100%;\n  background: #000;\n}\n.wk-detail-player iframe {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  border: 0;\n}\n\n/* ---- Ficha técnica ---- */\n.wk-ficha {\n  margin-top: 56px;\n  padding-top: 28px;\n  border-top: 1px solid rgba(255,255,255,0.14);\n  display: grid;\n  grid-template-columns: 220px 1fr;\n  gap: 24px 5%;\n}\n.wk-ficha[hidden] { display: none; }\n.wk-ficha-label {\n  font-family: 'SF Mono', 'Roboto Mono', 'Courier New', Consolas, monospace;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.5);\n  padding-top: 4px;\n}\n.wk-ficha-list {\n  margin: 0;\n  display: grid;\n  grid-template-columns: minmax(140px, max-content) 1fr;\n  column-gap: 32px;\n  row-gap: 12px;\n  font-size: 15px;\n  line-height: 1.45;\n}\n.wk-ficha-list dt { color: rgba(255,255,255,0.5); margin: 0; }\n.wk-ficha-list dd { color: #fff; margin: 0; }\n.wk-ficha-list .wk-ficha-full { grid-column: 1 / -1; color: rgba(255,255,255,0.85); }\n\n@media (max-width: 760px) {\n  .wk-detail-inner { padding: 90px 6% 70px; }\n  .wk-ficha { grid-template-columns: 1fr; gap: 18px; margin-top: 40px; }\n  .wk-ficha-list { grid-template-columns: 1fr; row-gap: 2px; }\n  .wk-ficha-list dd { margin-bottom: 12px; }\n}\n";
    document.head.appendChild(styleEl);
  }

  function buildRollChars(text) {
    var wrap = document.createDocumentFragment();
    var words = text.split(' ');
    var charIndex = 0;
    for (var w = 0; w < words.length; w++) {
      var wordWrap = document.createElement('span');
      wordWrap.className = 'wk-roll-word';
      for (var i = 0; i < words[w].length; i++) {
        var ch = words[w].charAt(i);
        var outer = document.createElement('span');
        outer.className = 'wk-roll-char';
        outer.style.transitionDelay = (charIndex * 18) + 'ms';
        var front = document.createElement('span');
        front.className = 'wk-rc-face wk-rc-front';
        front.textContent = ch;
        var back = document.createElement('span');
        back.className = 'wk-rc-face wk-rc-back';
        back.textContent = ch;
        outer.appendChild(front);
        outer.appendChild(back);
        wordWrap.appendChild(outer);
        charIndex++;
      }
      wrap.appendChild(wordWrap);
      if (w < words.length - 1) wrap.appendChild(document.createTextNode(' '));
    }
    return wrap;
  }

  function buildNavItem(cat, isActive, onClick) {
    var item = document.createElement('div');
    item.className = 'wk-roll-item' + (isActive ? ' active' : '');
    item.setAttribute('data-cat', cat.key);
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.appendChild(buildRollChars(cat.label.toUpperCase()));
    item.addEventListener('click', onClick);
    item.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); }
    });
    return item;
  }

  function buildVideoRow(video, index, onOpen) {
    var row = document.createElement('div');
    row.className = 'wk-video-row';

    var num = document.createElement('span');
    num.className = 'wk-video-num';
    num.textContent = (index + 1 < 10 ? '0' : '') + (index + 1);

    var nameWrap = document.createElement('span');
    nameWrap.className = 'wk-video-name-wrap';
    var nameInner = document.createElement('span');
    nameInner.className = 'wk-video-name-inner';
    var l1 = document.createElement('span');
    l1.className = 'wk-line';
    l1.textContent = video.title;
    var l2 = document.createElement('span');
    l2.className = 'wk-line';
    l2.textContent = video.title;
    nameInner.appendChild(l1);
    nameInner.appendChild(l2);
    nameWrap.appendChild(nameInner);

    var arrow = document.createElement('span');
    arrow.className = 'wk-video-arrow';
    arrow.textContent = '↗';

    row.appendChild(num);
    row.appendChild(nameWrap);
    row.appendChild(arrow);

    row.addEventListener('click', function () { onOpen(video); });

    return row;
  }

  function buildSoonPanel(cat) {
    var panel = document.createElement('div');
    panel.className = 'wk-panel wk-soon-panel';
    panel.setAttribute('data-panel', cat.key);

    var tag = document.createElement('span');
    tag.className = 'wk-soon-tag';
    tag.textContent = 'EM BREVE';

    var label = document.createElement('h3');
    label.className = 'wk-soon-label';
    label.textContent = cat.label;

    var desc = document.createElement('p');
    desc.className = 'wk-soon-desc';
    desc.textContent = 'Esta categoria está em curadoria. Em breve, cada trabalho vai ganhar seu próprio case aqui — com imagem, contexto e crédito completo.';

    panel.appendChild(tag);
    panel.appendChild(label);
    panel.appendChild(desc);
    return panel;
  }

  function buildDetailOverlay() {
    var overlay = document.createElement('div');
    overlay.className = 'wk-detail';
    overlay.id = 'wk-detail';

    var inner = document.createElement('div');
    inner.className = 'wk-detail-inner';

    var back = document.createElement('button');
    back.className = 'wk-back';
    back.type = 'button';
    back.textContent = '← VOLTAR';
    back.addEventListener('click', closeDetail);

    var title = document.createElement('h2');
    title.className = 'wk-detail-title';
    title.id = 'wk-detail-title';

    var playerWrap = document.createElement('div');
    playerWrap.className = 'wk-detail-player';
    playerWrap.id = 'wk-detail-player';

    var ficha = document.createElement('section');
    ficha.className = 'wk-ficha';
    ficha.id = 'wk-detail-ficha';
    ficha.hidden = true;
    var fichaLabel = document.createElement('span');
    fichaLabel.className = 'wk-ficha-label';
    fichaLabel.textContent = 'Ficha técnica';
    var fichaList = document.createElement('dl');
    fichaList.className = 'wk-ficha-list';
    fichaList.id = 'wk-detail-ficha-list';
    ficha.appendChild(fichaLabel);
    ficha.appendChild(fichaList);

    inner.appendChild(back);
    inner.appendChild(title);
    inner.appendChild(playerWrap);
    inner.appendChild(ficha);
    overlay.appendChild(inner);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeDetail();
    });

    document.body.appendChild(overlay);
    return overlay;
  }

  function fillFicha(video) {
    var ficha = document.getElementById('wk-detail-ficha');
    var list = document.getElementById('wk-detail-ficha-list');
    if (!ficha || !list) return;
    list.innerHTML = '';
    var rows = (video.ficha || []).filter(function (r) {
      return r && (Array.isArray(r) ? r.join('').trim() : String(r).trim());
    });
    rows.forEach(function (r) {
      if (!Array.isArray(r)) r = [String(r)];
      if (r.length >= 2 && String(r[0]).trim()) {
        var dt = document.createElement('dt');
        dt.textContent = r[0];
        var dd = document.createElement('dd');
        dd.textContent = r.slice(1).join(', ');
        list.appendChild(dt);
        list.appendChild(dd);
      } else {
        var full = document.createElement('dd');
        full.className = 'wk-ficha-full';
        full.textContent = r.filter(Boolean).join(' ');
        list.appendChild(full);
      }
    });
    ficha.hidden = rows.length === 0;
  }

  function closeDetail() {
    var overlay = document.getElementById('wk-detail');
    if (!overlay) return;
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
    setTimeout(function () {
      var playerWrap = document.getElementById('wk-detail-player');
      if (playerWrap) playerWrap.innerHTML = '';
    }, 350);
  }

  function openDetail(video) {
    var overlay = document.getElementById('wk-detail') || buildDetailOverlay();
    var title = document.getElementById('wk-detail-title');
    var playerWrap = document.getElementById('wk-detail-player');
    title.textContent = video.title;

    var ratio = (video.height / video.width) * 100;
    playerWrap.style.paddingTop = ratio + '%';
    playerWrap.innerHTML = '';
    var iframe = document.createElement('iframe');
    iframe.src = 'https://player.vimeo.com/video/' + video.id + '?app_id=122963';
    iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
    iframe.setAttribute('allowfullscreen', '');
    playerWrap.appendChild(iframe);

    fillFicha(video);
    overlay.scrollTop = 0;

    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { overlay.classList.add('is-open'); });
  }

  function buildSection(anchor) {
    injectStyles();

    var tabs = document.createElement('div');
    tabs.className = 'wk-tabs';
    tabs.id = 'wk-tabs';

    var nav = document.createElement('div');
    nav.className = 'wk-tabs-nav';
    var caption = document.createElement('div');
    caption.className = 'wk-tabs-nav-caption';
    caption.textContent = 'CATEGORIAS';
    nav.appendChild(caption);

    var panelWrap = document.createElement('div');
    panelWrap.className = 'wk-tabs-panel';

    var videoListPanel = document.createElement('div');
    videoListPanel.className = 'wk-panel wk-video-list is-active';
    videoListPanel.setAttribute('data-panel', 'video');
    VIDEOS.forEach(function (video, i) {
      videoListPanel.appendChild(buildVideoRow(video, i, openDetail));
    });
    panelWrap.appendChild(videoListPanel);

    var panelsByKey = { video: videoListPanel };
    CATS.filter(function (c) { return !c.ready; }).forEach(function (cat) {
      var p = buildSoonPanel(cat);
      panelWrap.appendChild(p);
      panelsByKey[cat.key] = p;
    });

    function selectCat(key) {
      Array.prototype.forEach.call(nav.querySelectorAll('.wk-roll-item'), function (el) {
        el.classList.toggle('active', el.getAttribute('data-cat') === key);
      });
      Object.keys(panelsByKey).forEach(function (k) {
        panelsByKey[k].classList.toggle('is-active', k === key);
      });
    }

    CATS.forEach(function (cat, i) {
      var item = buildNavItem(cat, i === 0, function () { selectCat(cat.key); });
      nav.appendChild(item);
    });

    tabs.appendChild(nav);
    tabs.appendChild(panelWrap);

    anchor.insertAdjacentElement('afterend', tabs);
    anchor.style.display = 'none';

    mounted = true;
  }

  function tryMount(attemptsLeft) {
    if (mounted) return;
    var anchor = document.querySelector('.wk-index');
    if (!anchor) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildSection(anchor);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(40); });
  } else {
    tryMount(40);
  }
})();
</script>
