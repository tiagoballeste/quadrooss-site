<script>/* ============================================================
   OptionWheel — vanilla JS port (React Bits -> Cargo.site)
   Replaces the plain top-left WORK/ARCHIVE/JOURNAL/ABOUT/CONTACT nav
   on the home page with a toggle button that opens a curved wheel nav
   (same 5 links), matching the React Bits OptionWheel design.
   Runs bridged inside an <iframe srcdoc> so it can execute at all on
   Cargo.site (see dome-gallery-bridged.js for the why).
   ============================================================ */
(function () {
  'use strict';

  var isBridged = (function () { try { return window.parent && window.parent !== window && !!window.parent.document; } catch (e) { return false; } })();
  var parentWindow = isBridged ? window.parent : window;
  var document = parentWindow.document;
  var requestAnimationFrame = function (cb) { return parentWindow.requestAnimationFrame(cb); };
  var cancelAnimationFrame = function (id) { return parentWindow.cancelAnimationFrame(id); };
  var location = parentWindow.location;

  var ITEMS = [
    { label: 'Work', href: 'https://852526.cargo.site/work' },
    { label: 'Archive', href: 'https://852526.cargo.site/archive' },
    { label: 'Journal', href: 'https://852526.cargo.site/journal' },
    { label: 'About', href: 'https://852526.cargo.site/about' },
    { label: 'Contact', href: 'https://852526.cargo.site/contact' }
  ];

  var CFG = {
    fontSize: 1.4,   // rem
    spacing: 1.5,
    curve: 1,
    tilt: 7,
    blur: 2,
    fade: 0.22,
    minOpacity: 0.18,
    smoothing: 220,
    inset: 64,        // px
    loop: false
  };

  (function injectStyles() {
    if (document.getElementById('ow-styles')) return;
    var styleEl = document.createElement('style');
    styleEl.id = 'ow-styles';
    styleEl.textContent = "/* OptionWheel — nav overlay (home page only) */\n\nbody.home .idx-nav { display: none !important; }\n\n.ow-toggle {\n  position: fixed;\n  top: 22px;\n  left: 20px;\n  z-index: 100000;\n  background: none;\n  border: none;\n  margin: 0;\n  padding: 8px;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  font-family: inherit;\n  -webkit-tap-highlight-color: transparent;\n}\n.ow-toggle__bars { width: 20px; height: 12px; position: relative; }\n.ow-toggle__bars span {\n  position: absolute; left: 0; right: 0; height: 1px; background: #fff;\n  transition: transform .25s ease, opacity .2s ease, top .25s ease;\n}\n.ow-toggle__bars span:nth-child(1){ top: 0; }\n.ow-toggle__bars span:nth-child(2){ top: 6px; }\n.ow-toggle__bars span:nth-child(3){ top: 12px; }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(1){ top: 6px; transform: rotate(45deg); }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(2){ opacity: 0; }\n.ow-toggle.is-open .ow-toggle__bars span:nth-child(3){ top: 6px; transform: rotate(-45deg); }\n\n.ow-backdrop {\n  position: fixed;\n  inset: 0;\n  z-index: 99998;\n  background: rgba(0,0,0,0.6);\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity .35s ease;\n}\n.ow-backdrop.is-open {\n  opacity: 1;\n  pointer-events: auto;\n}\n\n.ow-root {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  outline: none;\n  touch-action: none;\n  user-select: none;\n  cursor: grab;\n}\n.ow-root.ow-dragging { cursor: grabbing; }\n\n.ow-item {\n  position: absolute;\n  top: 50%;\n  left: var(--ow-inset, 64px);\n  white-space: nowrap;\n  text-decoration: none;\n  font-family: inherit;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 300;\n  font-size: var(--ow-font-size, 1.4rem);\n  line-height: 1;\n  transform-origin: left center;\n  cursor: pointer;\n  will-change: transform, opacity, filter;\n  color: color-mix(in srgb, #ffffff calc(var(--ow-p, 0) * 100%), #a6a6a6);\n}\n.ow-item--selected { font-weight: 400; }\n\n@media (max-width: 640px) {\n  .ow-item { font-size: calc(var(--ow-font-size, 1.4rem) * 0.8); }\n}\n";
    document.head.appendChild(styleEl);
  })();

  function currentIndex() {
    try {
      var path = location.pathname.replace(/\/$/, '').toLowerCase();
      for (var i = 0; i < ITEMS.length; i++) {
        var ip = ITEMS[i].href.replace(/^https?:\/\/[^/]+/, '').replace(/\/$/, '').toLowerCase();
        if (path === ip) return i;
      }
    } catch (e) {}
    return 0;
  }

  function buildWheel() {
    if (document.getElementById('ow-toggle')) return; // already mounted

    var remPx = parseFloat(parentWindow.getComputedStyle(document.documentElement).fontSize) || 16;

    // ---- toggle button ----
    var toggle = document.createElement('button');
    toggle.id = 'ow-toggle';
    toggle.className = 'ow-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-label', 'Abrir menu');
    toggle.innerHTML = '<span class="ow-toggle__bars"><span></span><span></span><span></span></span>';
    document.body.appendChild(toggle);

    // ---- backdrop + wheel root ----
    var backdrop = document.createElement('div');
    backdrop.id = 'ow-backdrop';
    backdrop.className = 'ow-backdrop';

    var root = document.createElement('div');
    root.className = 'ow-root';
    root.tabIndex = 0;
    root.setAttribute('role', 'listbox');
    root.setAttribute('aria-label', 'Menu de navegação');
    root.style.setProperty('--ow-font-size', CFG.fontSize + 'rem');
    root.style.setProperty('--ow-inset', CFG.inset + 'px');

    var itemEls = ITEMS.map(function (item, i) {
      var a = document.createElement('a');
      a.className = 'ow-item';
      a.href = item.href;
      a.textContent = item.label;
      a.setAttribute('role', 'option');
      a.dataset.index = String(i);
      root.appendChild(a);
      return a;
    });

    backdrop.appendChild(root);
    document.body.appendChild(backdrop);

    // ---- animation state ----
    var pos = currentIndex();
    var target = pos;
    var rafId = null;
    var last = 0;
    var dragMoved = false;
    var dragStart = null;
    var selectedIndex = -1;

    function runFrame(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      var tau = Math.max(CFG.smoothing, 1) / 1000;
      var k = 1 - Math.exp(-dt / tau);
      var next = pos + (target - pos) * k;
      var settled = Math.abs(target - next) < 0.001;
      if (settled) next = target;
      pos = next;

      var n = ITEMS.length;
      var tiltRad = (CFG.tilt * Math.PI) / 180;
      var rowH = CFG.fontSize * CFG.spacing * remPx;
      var R = tiltRad > 0.0005 ? rowH / tiltRad : 0;

      for (var i = 0; i < n; i++) {
        var el = itemEls[i];
        var d = i - pos;
        if (CFG.loop && n > 1) {
          d = ((d % n) + n) % n;
          if (d > n / 2) d -= n;
        }
        var dist = Math.abs(d);
        var x = 0, y = d * rowH, rot = 0;
        if (R > 0) {
          var ang = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, d * tiltRad));
          y = R * Math.sin(ang);
          x = -R * (1 - Math.cos(ang)) * CFG.curve;
          rot = (ang * 180) / Math.PI;
        }
        el.style.transform = 'translate(' + x.toFixed(2) + 'px, calc(' + y.toFixed(2) + 'px - 50%)) rotate(' + rot.toFixed(3) + 'deg)';
        el.style.opacity = String(Math.max(CFG.minOpacity, 1 - dist * CFG.fade));
        el.style.filter = CFG.blur > 0 ? 'blur(' + (dist * CFG.blur).toFixed(2) + 'px)' : 'none';
        el.style.setProperty('--ow-p', Math.max(0, 1 - Math.min(dist, 1)).toFixed(4));
      }

      rafId = settled ? null : requestAnimationFrame(runFrame);
    }

    function startLoop() {
      if (rafId != null) cancelAnimationFrame(rafId);
      last = parentWindow.performance.now();
      rafId = requestAnimationFrame(runFrame);
    }

    function applyTarget(value, snap) {
      var n = ITEMS.length;
      var v = value;
      if (!CFG.loop) v = Math.min(Math.max(v, 0), Math.max(n - 1, 0));
      if (snap) v = Math.round(v);
      target = v;
      var idx = ((Math.round(v) % n) + n) % n;
      if (idx !== selectedIndex) {
        selectedIndex = idx;
        for (var i = 0; i < n; i++) {
          itemEls[i].classList.toggle('ow-item--selected', i === idx);
        }
      }
      startLoop();
    }

    // ---- wheel/scroll ----
    root.addEventListener('wheel', function (e) {
      e.preventDefault();
      var rowH = CFG.fontSize * CFG.spacing * remPx;
      var delta = e.deltaMode === 1 ? e.deltaY * 24 : e.deltaY;
      var step = Math.max(-1, Math.min(1, delta / rowH));
      applyTarget(target + step, false);
      clearTimeout(root._owWheelTimer);
      root._owWheelTimer = setTimeout(function () { applyTarget(target, true); }, 140);
    }, { passive: false });

    // ---- drag ----
    root.addEventListener('pointerdown', function (e) {
      dragStart = { y: e.clientY, start: target, id: e.pointerId };
      dragMoved = false;
    });
    root.addEventListener('pointermove', function (e) {
      if (!dragStart) return;
      var dy = e.clientY - dragStart.y;
      if (!dragMoved && Math.abs(dy) > 4) {
        dragMoved = true;
        root.classList.add('ow-dragging');
        try { root.setPointerCapture(dragStart.id); } catch (err) {}
      }
      if (dragMoved) {
        var rowH = CFG.fontSize * CFG.spacing * remPx;
        applyTarget(dragStart.start - dy / rowH, false);
      }
    });
    function endDrag() {
      if (!dragStart) return;
      dragStart = null;
      root.classList.remove('ow-dragging');
      if (dragMoved) applyTarget(target, true);
    }
    root.addEventListener('pointerup', endDrag);
    root.addEventListener('pointercancel', endDrag);

    // Cancel navigation if the click was actually a drag.
    root.addEventListener('click', function (e) {
      if (dragMoved) {
        e.preventDefault();
        e.stopPropagation();
        dragMoved = false;
      }
    }, true);

    itemEls.forEach(function (el, i) {
      el.addEventListener('click', function () {
        if (dragMoved) return;
        applyTarget(i, true);
      });
    });

    root.addEventListener('keydown', function (e) {
      var delta = null;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') delta = -1;
      else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') delta = 1;
      if (delta != null) {
        e.preventDefault();
        applyTarget(Math.round(target) + delta, true);
        return;
      }
      if (e.key === 'Enter') {
        var idx = ((Math.round(target) % ITEMS.length) + ITEMS.length) % ITEMS.length;
        location.href = ITEMS[idx].href;
      }
      if (e.key === 'Escape') closeWheel();
    });

    // ---- open/close ----
    var prevOverflow = '';
    function openWheel() {
      toggle.classList.add('is-open');
      toggle.setAttribute('aria-label', 'Fechar menu');
      backdrop.classList.add('is-open');
      prevOverflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      applyTarget(currentIndex(), true);
      root.focus();
    }
    function closeWheel() {
      toggle.classList.remove('is-open');
      toggle.setAttribute('aria-label', 'Abrir menu');
      backdrop.classList.remove('is-open');
      document.documentElement.style.overflow = prevOverflow;
    }
    toggle.addEventListener('click', function () {
      if (backdrop.classList.contains('is-open')) closeWheel();
      else openWheel();
    });
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) closeWheel();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && backdrop.classList.contains('is-open')) closeWheel();
    });

    applyTarget(pos, true);
  }

  function tryMount(attemptsLeft) {
    if (!document.body || !document.body.classList.contains('home')) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildWheel();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(20); });
  } else {
    tryMount(20);
  }
})();
</script>
