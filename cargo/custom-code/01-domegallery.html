  function buildImagesFromPairs(pairs) {
    return pairs.map(function (p) {
      return { src: 'https://freight.cargo.site/w/1200/q/80/i/' + p[0] + '/' + p[1], alt: '' };
    });
  }

  function harvestImagesAndMount() {
    if (document.getElementById('dg-root')) return;
    var foot = document.querySelector('.ar-foot');
    if (!foot) return;
    var pairs = DG_MEDIA_PAIRS;
    if (!pairs || !pairs.length) return;

    var images = buildImagesFromPairs(pairs);

    var root = document.createElement('div');
    root.id = 'dg-root';
    foot.parentNode.insertBefore(root, foot);

    parentWindow.__dgInstance = new DomeGallery(root, {
      images: images,
      fit: 0.75,
      minRadius: 800,
      maxVerticalRotationDeg: 9,
      overlayBlurColor: '#0b0b0a',
      autoRotateSpeed: -0.0025,
      grayscale: false
    });
  }

  function tryMount(attemptsLeft) {
    harvestImagesAndMount();
    if (!document.getElementById('dg-root') && attemptsLeft > 0) {
      setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(20); });
  } else {
