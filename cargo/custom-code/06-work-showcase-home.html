<script>
/* ============================================================
   Work Showcase — vanilla JS port (React Bits -> Cargo.site)
   Combines two React Bits components into one mounted section,
   placed on the Home page right after the client logos:
     1) FlowingMenu — 4 role labels (Diretor / Editor / Filmmaker /
        Produtor executivo), each linking to the Work page, with a
        flowing text marquee that slides in from the nearest edge
        on hover.
     2) AccordionGallery — a row of the main video works (thumbnails
        pulled from Vimeo), each panel expands on hover and links
        out to the Vimeo page.
   Mounted together (instead of as two separate iframes) so the two
   sections are guaranteed to land in the right order, stacked
   directly under one another, with no race condition between them.
   Runs bridged inside an iframe via srcdoc (see dome-gallery-bridged.js
   / option-wheel-bridged.js / logo-loop-bridged.js / scroll-reveal-bridged.js
   / scrambled-text-bridged.js for why).
   ============================================================ */
(function () {
  'use strict';

  var isBridged = (function () { try { return window.parent && window.parent !== window && !!window.parent.document; } catch (e) { return false; } })();
  var parentWindow = isBridged ? window.parent : window;
  var document = parentWindow.document;

  var ROLES = [
    { text: 'Diretor', link: 'work' },
    { text: 'Editor', link: 'work' },
    { text: 'Filmmaker', link: 'work' },
    { text: 'Produtor executivo', link: 'work' }
  ];

  var WORKS = [{"title": "KYAN CENA 2K25", "link": "https://vimeo.com/1142204764?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2089877907-4d084b63c280a4ed62f4d57897e8349de4685770caef78361a27e2d488dfdabd-d_960?region=us"}, {"title": "ABRA SUA CABECA - RESPEITA OS MOTOCAS (BEM BOLADO)", "link": "https://vimeo.com/1109124991?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2046562912-57c82dc2f35e5bf899155b0565ca5e391b81124b3dcfe704d66d223c3e7a6b38-d_960?region=us"}, {"title": "NOWDAYS 4/20", "link": "https://vimeo.com/1109152946?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2046597546-8ff41ec293287c7b97988207e096961d85b9a191c8b0997eb503bed3e343c1ed-d_960?region=us"}, {"title": "UMBRO URBAN GLOW", "link": "https://vimeo.com/1109146977?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2048987454-f55d8ca260d671cddee749b568c06d832d28ed3ccf165de2fbe78c2ecf2651e2-d_960?region=us"}, {"title": "BASSAN FESTIVAL SUBMUNDO", "link": "https://vimeo.com/1138942328?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2085430675-a1baeb767a684ba9faad31548ec7a419d597a91b292a47919e94067fbef85939-d_960?region=us"}, {"title": "CHAMPION \"WHAT MOVES YOU?\"", "link": "https://vimeo.com/1117107275?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2056940252-a971851b7d5f428319df70ca300829a3d5da3fcbc00f54a31e78da3f05af917d-d_960?region=us"}, {"title": "AFTER RUN CLUB - VINTAGE", "link": "https://vimeo.com/1109131583?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2046571140-1c201f94cba79c4e0d4ea10cd116d9f914eda4fda6d87181ad746e6a52c4e9f6-d_960?region=us"}, {"title": "AFTERMOVIE ADULTO IDEAL", "link": "https://vimeo.com/1142199635?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2089869824-c91ac3fdb0e7f8bb5d2a75461d6225975a421d3055ca727683040b90150845c7-d_960?region=us"}, {"title": "GHARD - ALPINISTA", "link": "https://vimeo.com/1109127106?fl=pl&fe=sh", "thumb": "https://i.vimeocdn.com/video/2046567472-1d162c88e95cda38c31f4c91e7f03d95e99c5405308fccc6eb449e2d07cc3298-d_960?region=us"}, {"title": "ANA CAROLINA", "link": "https://vimeo.com/1231793058?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207037865-220956fe45396edad995c7b893ae7c549c9fbf682e3cb05edcb703e7864960bc-d_960?region=us"}, {"title": "CATARINA TOURINHO VANS", "link": "https://vimeo.com/1231794622?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207039039-821ad6523c21d1b0d4097e6f794cb11e4216c8ccc35f88b3c90ff2697c880c9d-d_960?region=us"}, {"title": "AUDI Q3 NUITSZ", "link": "https://vimeo.com/1231794369?share=copy", "thumb": "https://i.vimeocdn.com/video/2207038853-84609f7037de792741bb004d0aa293f84a9d77dd0fcad5b750d4b266f233a873-d_960?region=us"}, {"title": "HAVAIANAS NUITSZ", "link": "https://vimeo.com/1231795435?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207040349-af60b4017549e7b2605187c2de85ca64f01f1b673cc296d5188b77ad1fe82d7d-d_960?region=us"}, {"title": "PEAK", "link": "https://vimeo.com/1231796874?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207042008-f13a8f44597e8469208c112daea63c730f3ee4a59aaabb89cb65427dbdc09f5f-d_960?region=us"}, {"title": "RUN & BASS NEXT STEP", "link": "https://vimeo.com/1231797379?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207042996-d0f03aa35fbf4934432358933e48af3589e5fb5b26d690075bd1b1bd1f7cc3ad-d_960?region=us"}, {"title": "RUN & BASS X GOODTIMES", "link": "https://vimeo.com/1231797380?share=copy&fl=sv&fe=ci", "thumb": "https://i.vimeocdn.com/video/2207043527-1ae31396e92e19feccd8453b3c30deddd2f16c7721531ea486359c3485d26980-d_960?region=us"}];

  var mounted = false;

  function injectStyles() {
    if (document.getElementById('fmag-styles')) return;
    var styleEl = document.createElement('style');
    styleEl.id = 'fmag-styles';
    styleEl.textContent = "#fmag-wrap { width: 100%; } .fm-wrap { background: #120F17; width: 100%; } .fm-menu { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; } .fm-item { position: relative; overflow: hidden; text-align: center; height: 13vh; min-height: 78px; max-height: 160px; border-top: 1px solid rgba(255, 255, 255, 0.22); } .fm-item:first-child { border-top: none; } .fm-item-link { display: flex; align-items: center; justify-content: center; height: 100%; position: relative; z-index: 2; cursor: pointer; text-transform: uppercase; text-decoration: none; white-space: nowrap; font-weight: 600; font-size: 3.6vh; color: rgba(255, 255, 255, 0.9); transition: color 0.3s ease; } .fm-marquee { position: absolute; inset: 0; overflow: hidden; width: 100%; height: 100%; pointer-events: none; background: #fff; transform: translate3d(0, 101%, 0); z-index: 1; } .fm-marquee-inner { display: flex; align-items: center; height: 100%; width: max-content; animation: fm-scroll 10s linear infinite; } .fm-marquee-part { display: flex; align-items: center; flex-shrink: 0; } .fm-marquee span { white-space: nowrap; text-transform: uppercase; font-weight: 500; font-size: 3.6vh; line-height: 1; padding: 0 1.2vw; color: #120F17; } @keyframes fm-scroll { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } } @media (max-width: 640px) { .fm-item { height: 9vh; min-height: 58px; } .fm-item-link, .fm-marquee span { font-size: 2.2vh; } } .ag-section { width: 100%; padding: 64px 5% 80px; box-sizing: border-box; background: #0b0b0b; } .ag-caption { display: block; margin-bottom: 20px; opacity: 0.55; } .ag-gallery { display: flex; flex-direction: row; gap: 8px; width: 100%; height: 46vh; min-height: 320px; max-height: 560px; } .ag-panel { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; border-radius: 10px; cursor: pointer; display: block; text-decoration: none; background: #14141a; flex-grow: 1; transition: flex-grow 0.6s cubic-bezier(0.22, 1, 0.36, 1); } .ag-panel.ag-active { flex-grow: 7; } .ag-panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.8); transition: filter 0.6s ease; -webkit-user-drag: none; user-select: none; } .ag-panel.ag-active img { filter: grayscale(0) brightness(1); } .ag-panel-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 45%, rgba(6, 0, 16, 0.88) 100%); } .ag-panel-label { position: absolute; left: 16px; bottom: 14px; right: 16px; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateX(-10px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; } .ag-panel.ag-active .ag-panel-label { opacity: 1; transform: translateX(0); } .ag-panel-bar { flex: 0 0 auto; width: 3px; height: 20px; border-radius: 2px; background: #fff; } .ag-panel-text { color: #fff; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); } @media (max-width: 700px) { .ag-section { padding: 48px 5% 64px; } .ag-gallery { overflow-x: auto; scroll-snap-type: x mandatory; height: 40vh; -webkit-overflow-scrolling: touch; } .ag-panel { flex: 0 0 72%; scroll-snap-align: start; } .ag-panel img { filter: grayscale(0) brightness(1) !important; } .ag-panel-label { opacity: 1 !important; transform: none !important; } }";
    document.head.appendChild(styleEl);
  }

  /* ---------------- FlowingMenu ---------------- */

  function edgeFor(clientY, rect) {
    var y = clientY - rect.top;
    return y < rect.height / 2 ? 'top' : 'bottom';
  }

  function buildFlowingMenu() {
    var wrap = document.createElement('div');
    wrap.className = 'fm-wrap';
    wrap.id = 'fm-wrap';

    var nav = document.createElement('nav');
    nav.className = 'fm-menu';

    ROLES.forEach(function (role) {
      var item = document.createElement('div');
      item.className = 'fm-item';

      var link = document.createElement('a');
      link.className = 'fm-item-link';
      link.href = role.link;
      link.textContent = role.text;
      item.appendChild(link);

      var marquee = document.createElement('div');
      marquee.className = 'fm-marquee';

      var inner = document.createElement('div');
      inner.className = 'fm-marquee-inner';
      for (var i = 0; i < 12; i++) {
        var part = document.createElement('div');
        part.className = 'fm-marquee-part';
        var span = document.createElement('span');
        span.textContent = role.text;
        part.appendChild(span);
        inner.appendChild(part);
      }
      marquee.appendChild(inner);
      item.appendChild(marquee);

      function show(edge) {
        marquee.style.transition = 'none';
        marquee.style.transform = 'translate3d(0,' + (edge === 'top' ? '-101%' : '101%') + ',0)';
        marquee.offsetHeight; /* eslint-disable-line no-unused-expressions */
        marquee.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
        marquee.style.transform = 'translate3d(0,0,0)';
      }
      function hide(edge) {
        marquee.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
        marquee.style.transform = 'translate3d(0,' + (edge === 'top' ? '-101%' : '101%') + ',0)';
      }

      link.addEventListener('mouseenter', function (e) {
        show(edgeFor(e.clientY, item.getBoundingClientRect()));
      });
      link.addEventListener('mouseleave', function (e) {
        hide(edgeFor(e.clientY, item.getBoundingClientRect()));
      });

      nav.appendChild(item);
    });

    wrap.appendChild(nav);
    return wrap;
  }

  /* ---------------- AccordionGallery ---------------- */

  function buildAccordionGallery() {
    var section = document.createElement('div');
    section.className = 'ag-section';
    section.id = 'ag-wrap';

    var caption = document.createElement('span');
    caption.className = 'caption ag-caption';
    caption.textContent = 'TRABALHOS';
    section.appendChild(caption);

    var gallery = document.createElement('div');
    gallery.className = 'ag-gallery';

    var panels = [];
    WORKS.forEach(function (work, idx) {
      var panel = document.createElement('a');
      panel.className = 'ag-panel';
      panel.href = work.link;
      panel.target = '_blank';
      panel.rel = 'noopener noreferrer';
      panel.setAttribute('aria-label', work.title);

      var img = document.createElement('img');
      img.src = work.thumb;
      img.alt = work.title;
      img.loading = 'lazy';
      img.decoding = 'async';
      panel.appendChild(img);

      var overlay = document.createElement('span');
      overlay.className = 'ag-panel-overlay';
      panel.appendChild(overlay);

      var label = document.createElement('span');
      label.className = 'ag-panel-label';
      var bar = document.createElement('span');
      bar.className = 'ag-panel-bar';
      var text = document.createElement('span');
      text.className = 'ag-panel-text';
      text.textContent = work.title;
      label.appendChild(bar);
      label.appendChild(text);
      panel.appendChild(label);

      panel.addEventListener('mouseenter', function () { setActive(idx); });
      panel.addEventListener('focus', function () { setActive(idx); });

      panels.push(panel);
      gallery.appendChild(panel);
    });

    function setActive(idx) {
      for (var i = 0; i < panels.length; i++) {
        if (i === idx) { panels[i].classList.add('ag-active'); }
        else { panels[i].classList.remove('ag-active'); }
      }
    }
    setActive(0);

    section.appendChild(gallery);
    return section;
  }

  /* ---------------- mount ---------------- */

  function buildSection() {
    var clients = document.querySelector('.idx-clients');
    if (!clients || document.getElementById('fmag-wrap')) return;

    injectStyles();

    var wrap = document.createElement('div');
    wrap.id = 'fmag-wrap';
    wrap.appendChild(buildFlowingMenu());
    wrap.appendChild(buildAccordionGallery());

    clients.insertAdjacentElement('afterend', wrap);
    mounted = true;
  }

  function tryMount(attemptsLeft) {
    if (mounted) return;
    if (!document.body || !document.body.classList.contains('home') || !document.querySelector('.idx-clients')) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildSection();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(20); });
  } else {
    tryMount(20);
  }
})();

</script>
