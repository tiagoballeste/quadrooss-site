<script>
/* ============================================================
   ScrollReveal — vanilla JS port (React Bits -> Cargo.site)
   Word-by-word opacity/blur reveal, with a de-rotating container,
   as the About page statement quote scrolls into view.
   Mounts on the existing quote inside .ab-statement h2.
   Runs bridged inside an iframe via srcdoc (see dome-gallery-bridged.js
   / option-wheel-bridged.js / logo-loop-bridged.js for why).
   ============================================================ */
(function () {
  'use strict';

  var isBridged = (function () { try { return window.parent && window.parent !== window && !!window.parent.document; } catch (e) { return false; } })();
  var parentWindow = isBridged ? window.parent : window;
  var document = parentWindow.document;

  var CFG = {
    baseOpacity: 0,
    enableBlur: true,
    baseRotation: 5,
    blurStrength: 10,
    stagger: 0.55   // fraction of total scroll progress span given to word stagger
  };

  var mounted = false;
  var words = [];
  var container = null;

  function splitWords(h2) {
    var text = h2.textContent;
    var parts = text.split(/(\s+)/);
    h2.textContent = '';
    parts.forEach(function (part) {
      if (/^\s+$/.test(part)) {
        h2.appendChild(document.createTextNode(part));
      } else if (part.length) {
        var span = document.createElement('span');
        span.className = 'sr-word';
        span.textContent = part;
        h2.appendChild(span);
        words.push(span);
      }
    });
  }

  function update() {
    if (!container) return;
    var rect = container.getBoundingClientRect();
    var vh = parentWindow.innerHeight || document.documentElement.clientHeight;
    var p = (vh - rect.top) / (rect.height + vh * 0.4);
    if (p < 0) p = 0;
    if (p > 1) p = 1;

    container.style.transform = 'rotate(' + (CFG.baseRotation * (1 - p)) + 'deg)';

    var n = words.length;
    for (var i = 0; i < n; i++) {
      var start = n > 1 ? (i / (n - 1)) * (1 - CFG.stagger) : 0;
      var wp = (p - start) / CFG.stagger;
      if (wp < 0) wp = 0;
      if (wp > 1) wp = 1;
      var op = CFG.baseOpacity + (1 - CFG.baseOpacity) * wp;
      words[i].style.opacity = String(op);
      if (CFG.enableBlur) {
        words[i].style.filter = 'blur(' + (CFG.blurStrength * (1 - wp)).toFixed(2) + 'px)';
      }
    }
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      update();
      ticking = false;
    });
  }

  function injectStyles() {
    if (document.getElementById('sr-styles')) return;
    var styleEl = document.createElement('style');
    styleEl.id = 'sr-styles';
    styleEl.textContent = ".sr-container { transform-origin: 0% 50%; will-change: transform; } .sr-word { display: inline-block; will-change: opacity, filter; }";
    document.head.appendChild(styleEl);
  }

  function buildReveal() {
    var h2 = document.querySelector('.ab-statement h2');
    if (!h2 || h2.getAttribute('data-sr-mounted')) return;
    h2.setAttribute('data-sr-mounted', '1');
    h2.classList.add('sr-container');
    container = h2;
    splitWords(h2);
    injectStyles();
    update();
    parentWindow.addEventListener('scroll', onScroll, { passive: true });
    parentWindow.addEventListener('resize', onScroll);
    mounted = true;
  }

  function tryMount(attemptsLeft) {
    if (mounted) return;
    if (!document.querySelector('.ab-statement h2')) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildReveal();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(20); });
  } else {
    tryMount(20);
  }
})();

</script>
