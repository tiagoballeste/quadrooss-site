<script>/* ============================================================

   Horizontal marquee of client logos, scrolling right -> left,
   mounted into the existing .idx-clients section (right after the
   video on the home page), replacing the old static placeholder grid.
   Runs bridged inside an iframe via srcdoc (see dome-gallery-bridged.js
   / option-wheel-bridged.js for why).

00,"h":354},{"hash":"G3158456141449763522134757933105","name":"Prancheta-17.png","w":1000,"h":354},{"hash":"K3158456141246849337323952865329","name":"Prancheta-6.png","w":1000,"h":354},{"hash":"G3158456141837145147682658517041","name":"Prancheta-39.png","w":1000,"h":354},{"hash":"X3158456141228402593250243313713","name":"Prancheta-5.png","w":1000,"h":354},{"hash":"H3158456141173062361029114658865","name":"Prancheta-2.png","w":1000,"h":354},{"hash":"W3158456141781804915461529862193","name":"Prancheta-36.png","w":1000,"h":354},{"hash":"E3158456141486657010282177036337","name":"Prancheta-19.png","w":1000,"h":354},{"hash":"P3158456141505103754355886587953","name":"Prancheta-20.png","w":1000,"h":354},{"hash":"M3158456141910932123977496723505","name":"Prancheta-44.png","w":1000,"h":354},{"hash":"O3158456141468210266208467484721","name":"Prancheta-18.png","w":1000,"h":354},{"hash":"F3158456141689571195092982104113","name":"Prancheta-31.png","w":1000,"h":355},{"hash":"E3158456141209955849176533762097","name":"Prancheta-4.png","w":1000,"h":354},{"hash":"S3158456141560443986577015242801","name":"Prancheta-23.png","w":1000,"h":354},{"hash":"G3158456141597337474724434346033","name":"Prancheta-25.png","w":1000,"h":354},{"hash":"A3158456141763358171387820310577","name":"Prancheta-35.png","w":1000,"h":354},{"hash":"E3158456141302189569545081520177","name":"Prancheta-9.png","w":1000,"h":354},{"hash":"T3158456141708017939166691655729","name":"Prancheta-32.png","w":1000,"h":354},{"hash":"Y3158456141892485379903787171889","name":"Prancheta-42.png","w":1000,"h":354},{"hash":"Y3158456141523550498429596139569","name":"Prancheta-21.png","w":1000,"h":354},{"hash":"V3158456141671124451019272552497","name":"Prancheta-30.png","w":1000,"h":354}];

  var CFG = {
    logoHeight: 40,
    gap: 48,
    speed: 55,      // px / second
    quality: 90
  };

  function cdnUrl(item) {
    var targetW = Math.max(60, Math.round(item.w * (CFG.logoHeight / item.h)) * 2);
    return 'https://freight.cargo.site/w/' + targetW + '/q/' + CFG.quality + '/i/' + item.hash + '/' + encodeURIComponent(item.name);
  }

  (function injectStyles() {
    if (document.getElementById('ll-styles')) return;
    var styleEl = document.createElement('style');
    styleEl.id = 'll-styles';
    styleEl.textContent = "/* LogoLoop — client logos marquee (home page, right-to-left) */\n\n.idx-clients-grid, .idx-clients-note { display: none !important; }\n\n.ll-wrap {\n  position: relative;\n  width: 100%;\n  overflow: hidden;\n  padding: 18px 0;\n  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 64px, #000 calc(100% - 64px), transparent 100%);\n  mask-image: linear-gradient(to right, transparent 0, #000 64px, #000 calc(100% - 64px), transparent 100%);\n}\n\n.ll-track {\n  display: flex;\n  align-items: center;\n  width: max-content;\n  animation-name: ll-scroll;\n  animation-timing-function: linear;\n  animation-iteration-count: infinite;\n}\n\n.ll-wrap.ll-paused .ll-track { animation-play-state: paused; }\n\n@keyframes ll-scroll {\n  from { transform: translate3d(0, 0, 0); }\n  to { transform: translate3d(-50%, 0, 0); }\n}\n\n.ll-item {\n  flex: 0 0 auto;\n  margin-right: var(--ll-gap, 48px);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.ll-item img {\n  display: block;\n  height: var(--ll-logo-h, 40px);\n  width: auto;\n  object-fit: contain;\n  border-radius: 4px;\n  filter: opacity(0.8);\n  transition: filter .25s ease, transform .25s ease;\n  -webkit-user-drag: none;\n  user-select: none;\n  pointer-events: none;\n}\n\n@media (max-width: 640px) {\n  .ll-wrap { --ll-logo-h: 28px; --ll-gap: 32px; }\n}\n";
    document.head.appendChild(styleEl);
  })();

  function buildLoop() {
    var grid = document.querySelector('.idx-clients-grid');
    if (!grid || document.getElementById('ll-wrap')) return; // no container, or already mounted
    var section = grid.closest ? grid.closest('.idx-clients') : grid.parentElement;
    if (!section) return;

    var wrap = document.createElement('div');
    wrap.id = 'll-wrap';
    wrap.className = 'll-wrap';

    var track = document.createElement('div');
    track.className = 'll-track';

    function appendCopy() {
      LOGOS.forEach(function (item) {
        var el = document.createElement('div');
        el.className = 'll-item';
        var img = document.createElement('img');
        img.src = cdnUrl(item);
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.style.width = (item.w * (CFG.logoHeight / item.h)).toFixed(1) + 'px';
        el.appendChild(img);
        track.appendChild(el);
      });
    }
    appendCopy();
    appendCopy(); // duplicate for seamless loop

    wrap.appendChild(track);
    section.appendChild(wrap);

    var oneSetWidth = LOGOS.reduce(function (sum, item) {
      return sum + item.w * (CFG.logoHeight / item.h) + CFG.gap;
    }, 0);
    var duration = Math.max(8, oneSetWidth / CFG.speed);
    track.style.animationDuration = duration.toFixed(2) + 's';
  }

  function tryMount(attemptsLeft) {
    if (!document.body || !document.body.classList.contains('home')) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    if (!document.querySelector('.idx-clients-grid')) {
      if (attemptsLeft > 0) setTimeout(function () { tryMount(attemptsLeft - 1); }, 400);
      return;
    }
    buildLoop();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { tryMount(20); });
  } else {
    tryMount(20);
  }
})();
</script>
